name: Build Global Connect Reports

on:
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Reports run inside the connect-reports-runner image, which is built on
        # connectacr.azurecr.io/connect-python:3.12.8. Test on that version only.
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/test.txt
    # Non-blocking: 58 violations predate this workflow and live in reports that
    # are unrelated to any change gating on it. The findings stay visible in the
    # job log; drop continue-on-error once they are cleared.
    - name: Linting
      continue-on-error: true
      run: |
        flake8 .
    - name: Testing
      run: |
        pytest
